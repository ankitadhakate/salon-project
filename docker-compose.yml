# Optional production-shaped stack. `next start` runs with NODE_ENV=production
# and refuses development secrets, http origins, and local image storage.
# Day-to-day work uses `npm run dev` against Postgres. See README and DEPLOY.md.

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: salon
      POSTGRES_PASSWORD: salon
      POSTGRES_DB: salon
    volumes:
      - salon-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U salon -d salon"]
      interval: 5s
      timeout: 5s
      retries: 12

  web:
    build: .
    ports:
      - "3847:3847"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://salon:salon@db:5432/salon
      DIRECT_URL: postgresql://salon:salon@db:5432/salon
      NODE_ENV: production
    # One container, so migrate then listen. Cloud Run uses the image command and a separate job.
    command: ["sh", "-c", "sh scripts/migrate-job.sh && exec sh scripts/entrypoint.sh"]
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  salon-pg:
