# Optional production-shaped stack. `next start` runs with NODE_ENV=production
# and refuses development secrets, http origins, and local image storage.
# Day-to-day work uses `npm run dev` against Postgres. See README and DEPLOY.md.

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: saj
      POSTGRES_PASSWORD: saj
      POSTGRES_DB: saj
    volumes:
      - saj-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saj -d saj"]
      interval: 5s
      timeout: 5s
      retries: 12

  web:
    build: .
    ports:
      - "3847:3847"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://saj:saj@db:5432/saj
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  saj-pg:
